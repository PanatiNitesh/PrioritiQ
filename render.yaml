# Render Infrastructure-as-Code Blueprint
# PrioritiQ: Enterprise Evidence-Grounded AI Sales Decision Engine
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Unified Production Web Service (FastAPI + React 18 SPA Console)
  - type: web
    name: prioritiq
    env: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: VITE_API_BASE
        value: /api
